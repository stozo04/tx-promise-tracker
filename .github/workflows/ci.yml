# Checks every pull request (and every push to main) against AGENTS.md rule 18.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build reads the ledger with the public, read-only Supabase key in .env.example.
      - run: cp .env.example .env.local
      - name: Lint (includes the project rules in eslint.config.mjs)
        run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  edge-functions:
    name: Deno check Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check
        run: |
          for fn in supabase/functions/*/index.ts; do
            echo "Checking $fn"
            deno check "$fn"
          done
