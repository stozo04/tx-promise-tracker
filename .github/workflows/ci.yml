# Checks every pull request (and every push to main) against AGENTS.md rules 18 and 21.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build reads the ledger with the public, read-only Supabase key in .env.example.
      - run: cp .env.example .env.local
      - name: Lint (includes the project rules in eslint.config.mjs)
        run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  edge-functions:
    name: Deno check Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check
        run: |
          # The repo-root package.json would make Deno look for packages in node_modules,
          # which this job never installs. Use Deno's own package cache instead.
          for fn in supabase/functions/*/index.ts; do
            echo "Checking $fn"
            deno check --node-modules-dir=none "$fn"
          done
      - name: deno test (Sync parsers and rules, on saved primary-source pages)
        run: deno test --allow-read --node-modules-dir=none supabase/functions/tx_sync/tests/

  sync-docs:
    # AGENTS.md rule 21: a change to Sync comes with a change to SYNC.md.
    name: SYNC.md updated with Sync changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync changes come with SYNC.md
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          sync=$(printf '%s\n' "$changed" \
            | grep -E '^(supabase/functions/tx_sync/|scripts/sync-live-check\.ts$|lib/sync\.ts$|components/sync-button\.tsx$|app/api/sync/)' \
            | grep -v '^supabase/functions/tx_sync/tests/' || true)
          if [ -z "$sync" ]; then
            echo "No Sync files changed."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qx 'SYNC.md'; then
            echo "Sync files changed and SYNC.md was updated."
            exit 0
          fi
          if printf '%s' "$PR_BODY" | grep -q 'SYNC.md: no change needed'; then
            echo "Sync files changed; the description says SYNC.md needs no change."
            exit 0
          fi
          echo "::error::These Sync files changed but SYNC.md did not (AGENTS.md rule 21):"
          printf '%s\n' "$sync"
          echo "Update SYNC.md, or add 'SYNC.md: no change needed' and the reason to the pull request description."
          exit 1
