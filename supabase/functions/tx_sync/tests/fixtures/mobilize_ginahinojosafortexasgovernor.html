n_message": null, "private_details": null, "rendered_private_details": null, "virtual_join_url": null, "zoom_meeting_id": null, "zoom_meeting_type": null}, {"accessibility_features": [], "accessibility_notes": "", "accessibility_status": 1, "advocacy_campaign_id": null, "approval_status": 1, "chat_enabled": false, "check_in_enabled": null, "city": "Belton", "contact_host_enabled": true, "country": "US", "created_by_distributed_organizing": false, "custom_event_type_name": null, "deleted_at_utc": null, "description": "Join Us! Bell County Democratic Party Monthly CEC Meeting\n\nInterested in learning more about how your County Democratic Party works and how you can get involved? We'd love to have you join us!\n\nThe Bell County Democratic Party's County Executive Committee (CEC) meets monthly, and our meetings are open to the public!\n\nThe CEC is made up of elected and appointed Precinct Chairs who help govern the County Party, establish priorities, ensure we run fair and free elections, and guide our efforts to elect Democrats and strengthen our local Democratic community.\n\nWhat to Expect\n\nCEC meetings are official business meetings conducted under Robert's Rules of Order. While these are not open discussion forums, visitors are welcome to attend and observe the work of the County Party.\n\nAttending is a great opportunity to:\n\nLearn how your County Democratic Party operates and makes decisions.\n\nHear updates about our plans, priorities, activities, and upcoming elections.\n\nMeet County Party officers, Precinct Chairs, and other Democratic leaders.\n\nDiscover opportunities to volunteer, serve on committees, support voter outreach, and get more involved!\n\nMeeting Details\n\n\ud83d\udcc5 When: Third Thursday of the month\n\n\ud83d\udd60 Time: 6:30 PM\n\n\ud83d\udccd Where: Historic Bell County Courthouse, Belton, TX\n\nEveryone is welcome! Whether you're a longtime Democrat, a new volunteer, or simply curious about how your local Party operates, we encourage you to attend.\n\nPlease RSVP so we know you're interested and can share any important meeting updates.\n\nWe look forward to meeting you and helping you find your place in building a stronger Bell County Democratic Party!", "description_html": "\u003cp\u003eJoin Us! Bell County Democratic Party Monthly CEC Meeting\u003c/p\u003e\n\u003cp\u003eInterested in learning more about how your County Democratic Party works and how you can get involved? We'd love to have you join us!\u003c/p\u003e\n\u003cp\u003eThe Bell County Democratic Party's County Executive Committee (CEC) meets monthly, and our meetings are open to the public!\u003c/p\u003e\n\u003cp\u003eThe CEC is made up of elected and appointed Precinct Chairs who help govern the County Party, establish priorities, ensure we run fair and free elections, and guide our efforts to elect Democrats and strengthen our local Democratic community.\u003c/p\u003e\n\u003cp\u003eWhat to Expect\u003c/p\u003e\n\u003cp\u003eCEC meetings are official business meetings conducted under Robert's Rules of Order. While these are not open discussion forums, visitors are welcome to attend and observe the work of the County Party.\u003c/p\u003e\n\u003cp\u003eAttending is a great opportunity to:\u003c/p\u003e\n\u003cp\u003eLearn how your County Democratic Party operates and makes decisions.\u003c/p\u003e\n\u003cp\u003eHear updates about our plans, priorities, activities, and upcoming elections.\u003c/p\u003e\n\u003cp\u003eMeet County Party officers, Precinct Chairs, and other Democratic leaders.\u003c/p\u003e\n\u003cp\u003eDiscover opportunities to volunteer, serve on committees, support voter outreach, and get more involved!\u003c/p\u003e\n\u003cp\u003eMeeting Details\u003c/p\u003e\n\u003cp\u003e\ud83d\udcc5 When: Third Thursday of the month\u003c/p\u003e\n\u003cp\u003e\ud83d\udd60 Time: 6:30 PM\u003c/p\u003e\n\u003cp\u003e\ud83d\udccd Where: Historic Bell County Courthouse, Belton, TX\u003c/p\u003e\n\u003cp\u003eEveryone is welcome! Whether you're a longtime Democrat, a new volunteer, or simply curious about how your local Party operates, we encourage you to attend.\u003c/p\u003e\n\u003cp\u003ePlease RSVP so we know you're interested and can share any important meeting updates.\u003c/p\u003e\n\u003cp\u003eWe look forward to meeting you and helping you find your place in building a stronger Bell County Democratic Party!\u003c/p\u003e", "disable_participant_count": false, "disable_participant_goal": false, "event_suggestions": null, "event_type": 4, "external_sync": 1, "fundraising_goal_amount_in_cents": null, "group_should_include_all_events_by_hosts_by_default": false, "group_signup_enabled": false, "group_signup_size_limit": null, "id": 1080057, "is_virtual": false, "is_statewide": false, "location_is_private": false, "name": "Get to Know Your County Democratic Party! | Monthly CEC Meeting", "owning_org_van_location_id": null, "participant_goal": null, "post_signup_asks": [3, 2], "primary_locale": "en", "registration_mode": 1, "select_all_timeslots_enabled": false, "self_check_in_enabled": false, "starting_participant_count": null, "state": "TX", "tagline": "", "timezone": "America/Chicago", "van_name": "", "virtual_action_button_text": null, "virtual_action_disable_advance_signups": false, "virtual_action_url": null, "visibility": 1, "volunteer_check_in_is_enabled": false, "zipcode": "76513", "is_distributed_organizing_event_with_customizations": null, "creator": null, "creator_permission_tier": 1, "organization": {"id": 1526, "name": "Bell County Democratic Party", "slug": "bellcountydems", "state": "TX", "race_type": null, "district": "", "candidate_name": "", "is_primary_campaign": false, "reply_to_email": "info@bellcountydems.org", "org_type": 2, "facebook_pixel_id": null, "google_analytics_4_id": null, "slaask_app_id": null, "zendesk_subdomain": null, "intercom_app_id": null, "allow_promotion_by_other_orgs": true, "promotable_by_request": null, "can_only_promote_c3s": null, "override_membe
